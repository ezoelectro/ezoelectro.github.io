<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор плат | настраиваемый зазор</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 28px 32px;
            max-width: 1200px;
            width: fit-content;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 500;
            color: #1e293b;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            border-left: 6px solid #2d6a4f;
            padding-left: 16px;
        }
        .panel {
            display: flex;
            flex-wrap: wrap;
            gap: 30px 40px;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .param-group {
            background: #f8fafc;
            padding: 20px 20px 18px;
            border-radius: 20px;
            box-shadow: inset 0 1px 3px #0000000d, 0 2px 4px #0000000a;
            border: 1px solid #e2e8f0;
            width: 100%;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .param-row label {
            min-width: 140px;
            font-weight: 500;
            color: #334155;
        }
        .param-row input[type="number"] {
            width: 95px;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-weight: 500;
            background: white;
            box-shadow: 0 1px 2px #0000000a;
            transition: 0.15s;
        }
        .param-row input[type="number"]:focus {
            border-color: #2d6a4f;
            outline: none;
            ring: 3px solid #b7e4c7;
        }
        .param-row input[type="number"]:invalid {
            border-color: #dc2626;
            background-color: #fef2f2;
        }
        .param-row select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: white;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }
        .param-row .unit {
            color: #64748b;
            font-size: 0.9rem;
            margin-left: -6px;
        }
        .gap-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gap-inputs input[type="number"] {
            width: 80px;
        }
        .gap-inputs.disabled input {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            border-color: #ced4da;
            opacity: 0.7;
            pointer-events: none;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            white-space: nowrap;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2d6a4f;
            margin: 0;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .formula-highlight {
            background: #e9f0ef;
            padding: 8px 18px;
            border-radius: 5px;
            font-weight: 600;
            color: #0b3b2f;
            font-size: 1.15rem;
            white-space: nowrap;
        } 
        .formula-highlight span {
            color: #0f5e4a;
            background: #d0e6df;
            padding: 3px 12px;
            border-radius: 5px;
            margin-left: 8px;
            font-size: 1.3rem;
        }  
        .checkbox-group {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-left: 10px;
            margin-top: 8px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1e293b;
            font-weight: 500;
            background: #ffffffc0;
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            border: 1px solid #d9e2ef;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2d6a4f;
            margin: 0;
        }
        .canvas-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin: 10px 0 16px;
        }
        .canvas-size-info {
            background: #f1f5f9;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            color: #0f172a;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid #cbd5e1;
        }
        .canvas-size-info:hover {
            background: #e2e8f0;
        }
        .canvas-size-info span {
            color: #0f5e4a;
            background: #d0e6df;
            padding: 3px 12px;
            border-radius: 30px;
            margin-left: 8px;
            font-family: monospace;
            font-weight: 600;
        }
        .dimension-info {
            background: #e9f0ef;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            color: #0b3b2f;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px #b8d9cf;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 25px;
            align-items: baseline;
        }
        .dimension-item {
            white-space: nowrap;
        }
        .dimension-item strong {
            color: #0f5e4a;
            margin-right: 4px;
        }
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            margin-top: 5px;
            width: 100%;
            background-color: #f0f2f5;
            border-radius: 8px;
        }
        canvas {
            display: block;
            box-shadow: 6px 6px 9px 0px rgba(34, 60, 80, 0.33);
            background-color: white;
            cursor: pointer;
            max-width: 100%;
            height: auto;
            width: auto;
        }
        .performance-badge {
            background: #2d3e50;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-block;
            margin-left: 15px;
        }
        .optimized-badge {
            background: #0f5e4a;
        }
        .gap-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .inline-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🧩 Платы · зазор · блок <span class="performance-badge optimized-badge">⚡ гибкие настройки</span></h2>

    <div class="panel">
        <!-- плата и сетка -->
        <div class="param-group">
            <div class="param-row">
                <label>Размеры платы, мм (Ш×В):</label>
                <input type="number" id="boardW" value="40" step="0.01" min="1.0" max="1000">
                <span class="unit">x</span>
                <input type="number" id="boardH" value="20" step="0.01" min="1.0" max="1000">
                <span class="unit">мм</span>
            </div>
            <div class="param-row">
                <label>Раскладка в блоке (X×Y):</label>
                <input type="number" id="countX" value="2" min="1" max="100" step="1">
                <span class="unit">x</span>
                <input type="number" id="countY" value="2" min="1" max="100" step="1">
            </div>
            <div class="param-row">
                <label>Количество блоков N, шт:</label>
                <input type="number" id="countN" value="1" min="1" step="1">
                <span class="formula-highlight">(X×Y)×N = <span id="totalFormula">4</span> плат</span>
            </div>
            
            <!-- НАСТРОЙКИ: метод обработки и зазор с чекбоксом -->
            <div class="param-row">
                <label>Метод обработки контура:</label>
                <select id="methodSelect">
                    <option value="milling" selected>Фрезеровка</option>
                    <option value="scribing">Скрайбирование</option>
                </select>
            </div>
            
            <div class="param-row">
                <label>Зазор:</label>
                <div class="gap-controls">
                    <div class="inline-checkbox" id="standardCheckboxContainer">
                        <input type="checkbox" id="standardGapCheckbox" checked>
                        <span>Стандартный</span>
                    </div>
                    <div class="gap-inputs" id="gapInputsContainer">
                        <input type="number" id="gapX" value="2.3" step="0.1" min="0" max="100" style="width:80px;">
                        <span class="unit">x</span>
                        <input type="number" id="gapY" value="2.3" step="0.1" min="0" max="100" style="width:80px;">
                        <span class="unit">мм</span>
                    </div>
                </div>
            </div>
            
            <div class="param-row">
                <label>Поля верх/низ, лево/право, мм:</label>
                <input type="number" id="blockToGapV" value="5" step="0.01" min="0" max="200">
                <span class="unit">,</span>
                <input type="number" id="blockToGapH" value="5" step="0.01" min="0" max="200">
            </div>
            
            <!-- Контейнер для канвы -->
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas" width="600" height="450"></canvas>
            </div>
        </div>
    </div>

    <!-- чекбоксы слоёв и информация о размере канвы -->
    <div class="canvas-header">
        <div class="checkbox-group">
            <label><input type="checkbox" id="showBlock" checked> 🟢 Блок</label>
            <label><input type="checkbox" id="showGap" checked> 🟡 Зазор</label>
            <label><input type="checkbox" id="showGroupArea"> ⬜ Группа</label>
            <label><input type="checkbox" id="showBoards" checked> 🟩 Платы</label>
        </div>
        <div class="canvas-size-info" id="canvasSizeDisplay" title="Щелкните, чтобы изменить размер канвы">
            📐 Размер канвы: <span id="canvasSizeValue">600x450</span> px
        </div>
    </div>

    <!-- информация о размере блока, площади и количестве плат -->
    <div class="dimension-info" id="sizeDisplay">
        <span class="dimension-item"><strong>Блок:</strong> <span id="blockW">0.0</span> × <span id="blockH">0.0</span> мм</span>
        <span class="dimension-item"><strong>Площадь одного блока:</strong> <span id="blockArea">0.0000</span> дм²</span>
        <span class="dimension-item"><strong>Площадь одной платы:</strong> <span id="singleBoardArea">0.0000</span> дм²</span>
        <span class="dimension-item"><strong>Площадь одной платы в блоке:</strong> <span id="boardAreaInBlock">0.0000</span> дм² (+<span id="boardAreaInBlockPrcnt">0.00</span>%)</span>
        <span class="dimension-item"><strong>Плат в блоке:</strong> <span id="boardCountTotal">0</span> шт (<span id="boardCountX">0</span> x <span id="boardCountY">0</span>)</span>
    </div>
</div>

<script>
    (function() {
        // ---- ДВА ВАРИАНТА МАКСИМАЛЬНОЙ ШИРИНЫ КАНВЫ ----
        const SIZE_1 = { width: 640, height: 480 };
        const SIZE_2 = { width: 128, height: 96 };
        
        // Текущий максимальный размер (начинаем с 640x480)
        let MAX_CANVAS_WIDTH = SIZE_1.width;
        let MAX_CANVAS_HEIGHT = SIZE_1.height;
        let currentSizeIndex = 0;

        // ---- все элементы ----
        const boardW = document.getElementById('boardW');
        const boardH = document.getElementById('boardH');
        const countX = document.getElementById('countX');
        const countY = document.getElementById('countY');
        const countN = document.getElementById('countN');
        const blockToGapH = document.getElementById('blockToGapH'); 
        const blockToGapV = document.getElementById('blockToGapV');
        
        // Элементы настроек
        const standardGapCheckbox = document.getElementById('standardGapCheckbox');
        const methodSelect = document.getElementById('methodSelect');
        const gapX = document.getElementById('gapX');
        const gapY = document.getElementById('gapY');
        const gapInputsContainer = document.getElementById('gapInputsContainer');

        // элементы для отображения
        const totalFormula = document.getElementById('totalFormula');
        const canvasSizeDisplay = document.getElementById('canvasSizeDisplay');
        const canvasSizeValue = document.getElementById('canvasSizeValue');
                
        // элементы для размеров блока и количества
        const blockWEl = document.getElementById('blockW');
        const blockHEl = document.getElementById('blockH');
        const blockArea = document.getElementById('blockArea');
        const singleBoardArea = document.getElementById('singleBoardArea');
        const boardAreaInBlock = document.getElementById('boardAreaInBlock');
        const boardAreaInBlockPrcnt = document.getElementById('boardAreaInBlockPrcnt');
        const boardCountX = document.getElementById('boardCountX');
        const boardCountY = document.getElementById('boardCountY');
        const boardCountTotal = document.getElementById('boardCountTotal');

        // чекбоксы слоев
        const showBlock = document.getElementById('showBlock');
        const showGap = document.getElementById('showGap');
        const showGroupArea = document.getElementById('showGroupArea');
        const showBoards = document.getElementById('showBoards');

        // канва и обертка
        const canvas = document.getElementById('mainCanvas');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const ctx = canvas.getContext('2d');

        // Функция для сохранения пользовательских значений
        let lastUserGapX = 2.3;
        let lastUserGapY = 0;

        // ---- функция для обновления состояния чекбокса и полей зазора ----
        function updateGapControls() {
            const method = methodSelect.value;
            
            if (method === 'scribing') {
                // Для скрайбирования: чекбокс всегда включен и заблокирован
                standardGapCheckbox.checked = true;
                standardGapCheckbox.disabled = true;
                
                // Зазоры равны 0 и заблокированы
                gapX.value = '0';
                gapY.value = '0';
                gapX.disabled = true;
                gapY.disabled = true;
                gapInputsContainer.classList.add('disabled');
            } else {
                // Для фрезеровки: чекбокс можно переключать
                standardGapCheckbox.disabled = false;
                
                if (standardGapCheckbox.checked) {
                    // Стандартный режим фрезеровки
                    gapX.value = '2.3';
                    gapY.value = '2.3';
                    gapX.disabled = true;
                    gapY.disabled = true;
                    gapInputsContainer.classList.add('disabled');
                } else {
                    // Нестандартный режим фрезеровки
                    gapX.value = lastUserGapX.toString();
                    gapY.value = lastUserGapY.toString();
                    gapX.disabled = false;
                    gapY.disabled = false;
                    gapInputsContainer.classList.remove('disabled');
                }
            }
        }

        // ---- функция для сохранения пользовательских значений ----
        function saveUserGapValues() {
            const method = methodSelect.value;
            
            // Сохраняем только для фрезеровки в нестандартном режиме
            if (method === 'milling' && !standardGapCheckbox.checked) {
                const x = parseFloat(gapX.value);
                const y = parseFloat(gapY.value);
                if (!isNaN(x) && x >= 0) lastUserGapX = x;
                if (!isNaN(y) && y >= 0) lastUserGapY = y;
            }
        }

        // ---- функция получения чисел с учетом логики зазора ----
        function getValues() {
            const bw = Math.max(0.1, parseFloat(boardW.value) || 0.1);
            const bh = Math.max(0.1, parseFloat(boardH.value) || 0.1);
            const nx = Math.max(1, Math.min(100, parseInt(countX.value, 10) || 1));
            const ny = Math.max(1, Math.min(100, parseInt(countY.value, 10) || 1));
            const nBlocks = Math.max(1, parseInt(countN.value, 10) || 1);
            
            // Получаем значения зазора из полей
            let gx = parseFloat(gapX.value);
            let gy = parseFloat(gapY.value);
            
            // Если значения некорректные, устанавливаем по умолчанию
            if (isNaN(gx) || gx < 0) gx = 0;
            if (isNaN(gy) || gy < 0) gy = 0;
            
            const b2gX = Math.max(0, parseFloat(blockToGapH.value) || 0);
            const b2gY = Math.max(0, parseFloat(blockToGapV.value) || 0);
            
            const g2gX = (b2gX === 0) ? 0 : gx;
            const g2gY = (b2gY === 0) ? 0 : gy;
            
            return { bw, bh, nx, ny, nBlocks, gx, gy, b2gX, b2gY, g2gX, g2gY };
        }

        // ---- проверка, нужно ли рисовать границу ----
        function shouldDrawBorder(bw, bh) {
            return bw >= 2 && bh >= 2;
        }

        // ---- функция для определения максимальной ширины канвы на основе родителя ----
        function getMaxCanvasDimensions() {
            const wrapperWidth = canvasWrapper.clientWidth;
            let maxWidth = Math.min(wrapperWidth, MAX_CANVAS_WIDTH);
            let maxHeight = maxWidth * 0.75;
            maxHeight = Math.min(maxHeight, MAX_CANVAS_HEIGHT);
            return { width: maxWidth, height: maxHeight };
        }

        // ---- функция отрисовки ----
        function performRedraw() {
            // Сохраняем пользовательские значения
            saveUserGapValues();
            
            // Обновляем состояние элементов управления
            updateGapControls();
            
            const v = getValues();

            // ---- ОБНОВЛЯЕМ ЖИВУЮ СТРОКУ С ФОРМУЛОЙ ----
            const totalBoardsInBlock = v.nx * v.ny;
            const totalBoardsAllBlocks = totalBoardsInBlock * v.nBlocks;
            totalFormula.textContent = totalBoardsAllBlocks;
            
            // размеры группы плат
            const groupW = v.nx * v.bw + (v.nx - 1) * v.gx;
            const groupH = v.ny * v.bh + (v.ny - 1) * v.gy;

            // прямоугольник зазора
            const gapRectW = groupW + 2 * v.g2gX;
            const gapRectH = groupH + 2 * v.g2gY;

            // прямоугольник блока
            const blockRectW = gapRectW + 2 * v.b2gX;
            const blockRectH = gapRectH + 2 * v.b2gY;

            // площадь блока в дм²
            const areaDm2 = (blockRectW * blockRectH) / 10000;

            // площадь одной платы в дм²
            const singleBoardAreaDm2 = (v.bw * v.bh) / 10000;

            // площадь одной платы в блоке
            const boardAreaInBlockDm2 = areaDm2 / totalBoardsInBlock;
            
            // процент прибавки площади
            const boardAreaInBlockPrcnt2 = ((100 * boardAreaInBlockDm2) / singleBoardAreaDm2) - 100;
            
            // обновляем информационные поля
            blockWEl.textContent = blockRectW.toFixed(2);
            blockHEl.textContent = blockRectH.toFixed(2);
            blockArea.textContent = areaDm2.toFixed(4);
            singleBoardArea.textContent = singleBoardAreaDm2.toFixed(4);
            boardAreaInBlock.textContent = boardAreaInBlockDm2.toFixed(4);
            boardAreaInBlockPrcnt.textContent = boardAreaInBlockPrcnt2.toFixed(2);
            boardCountX.textContent = v.nx;
            boardCountY.textContent = v.ny;
            boardCountTotal.textContent = totalBoardsInBlock;

            if (blockRectW <= 0 || blockRectH <= 0) return;

            // ---- РАСЧЕТ РАЗМЕРОВ КАНВЫ ----
            const maxDimensions = getMaxCanvasDimensions();
            const padding = 0;
            
            const scaleX = (maxDimensions.width - padding * 2) / blockRectW;
            const scaleY = (maxDimensions.height - padding * 2) / blockRectH;
            const scale = Math.min(scaleX, scaleY, 20);
            
            const blockPxWidth = blockRectW * scale;
            const blockPxHeight = blockRectH * scale;
            
            canvas.width = Math.round(blockPxWidth + padding * 2);
            canvas.height = Math.round(blockPxHeight + padding * 2);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const finalScaleX = (canvas.width - padding * 2) / blockRectW;
            const finalScaleY = (canvas.height - padding * 2) / blockRectH;
            const blockScale = Math.min(finalScaleX, finalScaleY);
            
            const blockWidth = canvas.width - padding * 2;
            const blockHeight = canvas.height - padding * 2;
            
            const offsetX = padding;
            const offsetY = padding;

            // координаты углов в мм
            const blockLeft = 0;
            const blockTop = 0;
            const gapLeft = v.b2gX;
            const gapTop = v.b2gY;
            const groupLeft = v.b2gX + v.g2gX;
            const groupTop = v.b2gY + v.g2gY;

            // ---- РИСУЕМ ВСЕ СЛОИ ----
            
            if (showBlock.checked) {
                ctx.fillStyle = '#0c752f';
                ctx.fillRect(offsetX, offsetY, blockWidth, blockHeight);
            }

            if (showGap.checked) {
                ctx.fillStyle = '#f7d44a';
                const gapXpx = offsetX + gapLeft * blockScale;
                const gapYpx = offsetY + gapTop * blockScale;
                const gapWpx = gapRectW * blockScale;
                const gapHpx = gapRectH * blockScale;
                ctx.fillRect(gapXpx, gapYpx, gapWpx, gapHpx);
            }

            if (showGroupArea.checked) {
                ctx.fillStyle = '#ffffff';
                const groupXpx = offsetX + groupLeft * blockScale;
                const groupYpx = offsetY + groupTop * blockScale;
                const groupWpx = groupW * blockScale;
                const groupHpx = groupH * blockScale;
                ctx.fillRect(groupXpx, groupYpx, groupWpx, groupHpx);
            }

            if (showBoards.checked) {
                ctx.fillStyle = '#0c752f';
                
                for (let i = 0; i < v.nx; i++) {
                    for (let j = 0; j < v.ny; j++) {
                        const boardX = groupLeft + i * (v.bw + v.gx);
                        const boardY = groupTop + j * (v.bh + v.gy);
                        
                        const xPx = offsetX + boardX * blockScale;
                        const yPx = offsetY + boardY * blockScale;
                        const wPx = v.bw * blockScale;
                        const hPx = v.bh * blockScale;
                        
                        ctx.fillRect(xPx, yPx, wPx, hPx);
                    }
                }

                if (shouldDrawBorder(v.bw, v.bh)) {
                    ctx.save();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = Math.max(1, blockScale * 0.5);
                    
                    for (let i = 0; i < v.nx; i++) {
                        for (let j = 0; j < v.ny; j++) {
                            const boardX = groupLeft + i * (v.bw + v.gx);
                            const boardY = groupTop + j * (v.bh + v.gy);
                            
                            const xPx = offsetX + boardX * blockScale;
                            const yPx = offsetY + boardY * blockScale;
                            const wPx = v.bw * blockScale;
                            const hPx = v.bh * blockScale;
                            
                            const halfLine = ctx.lineWidth / 2;
                            
                            ctx.beginPath();
                            ctx.rect(
                                Math.round(xPx + halfLine), 
                                Math.round(yPx + halfLine), 
                                Math.round(wPx - ctx.lineWidth), 
                                Math.round(hPx - ctx.lineWidth)
                            );
                            ctx.stroke();
                        }
                    }
                    ctx.restore();
                }
            }

            canvasSizeValue.textContent = `${canvas.width}×${canvas.height}`;
        }

        // ---- Функция для переключения максимального размера канвы ----
        function toggleCanvasMaxSize() {
            currentSizeIndex = (currentSizeIndex + 1) % 2;
            
            if (currentSizeIndex === 0) {
                MAX_CANVAS_WIDTH = SIZE_1.width;
                MAX_CANVAS_HEIGHT = SIZE_1.height;
            } else {
                MAX_CANVAS_WIDTH = SIZE_2.width;
                MAX_CANVAS_HEIGHT = SIZE_2.height;
            }
            
            performRedraw();
        }

        // ---- Функция для обработки изменения размера окна ----
        function handleResize() {
            throttledRedraw();
        }

        // ---- throttled версия ----
        const throttledRedraw = throttle(performRedraw, 200);

        // ---- функция throttle ----
        function throttle(func, limit) {
            let inThrottle;
            let lastFunc;
            let lastRan;
            
            return function() {
                const context = this;
                const args = arguments;
                
                if (!inThrottle) {
                    func.apply(context, args);
                    lastRan = Date.now();
                    inThrottle = true;
                    
                    setTimeout(() => {
                        inThrottle = false;
                    }, limit);
                } else {
                    clearTimeout(lastFunc);
                    lastFunc = setTimeout(function() {
                        if (Date.now() - lastRan >= limit) {
                            func.apply(context, args);
                            lastRan = Date.now();
                        }
                    }, Math.max(limit - (Date.now() - lastRan), 0));
                }
            };
        }

        // ---- Обработчики для сохранения пользовательских значений ----
        gapX.addEventListener('input', function() {
            const method = methodSelect.value;
            // Сохраняем только для фрезеровки в нестандартном режиме
            if (method === 'milling' && !standardGapCheckbox.checked) {
                const val = parseFloat(gapX.value);
                if (!isNaN(val) && val >= 0) {
                    lastUserGapX = val;
                }
            }
            throttledRedraw();
        });

        gapY.addEventListener('input', function() {
            const method = methodSelect.value;
            // Сохраняем только для фрезеровки в нестандартном режиме
            if (method === 'milling' && !standardGapCheckbox.checked) {
                const val = parseFloat(gapY.value);
                if (!isNaN(val) && val >= 0) {
                    lastUserGapY = val;
                }
            }
            throttledRedraw();
        });

        // ---- подписка на изменения ----
        const inputs = [
            boardW, boardH, countX, countY, countN, 
            blockToGapH, blockToGapV,
            showBlock, showGap, showGroupArea, showBoards,
            standardGapCheckbox, methodSelect
        ];
        
        inputs.forEach(el => el.addEventListener('input', throttledRedraw));
        inputs.filter(el => el.type === 'checkbox').forEach(el => {
            el.addEventListener('change', throttledRedraw);
        });
        
        methodSelect.addEventListener('change', throttledRedraw);
        
        // ---- Обработчики кликов ----
        canvas.addEventListener('click', toggleCanvasMaxSize);
        canvasSizeDisplay.addEventListener('click', toggleCanvasMaxSize);
        
        window.addEventListener('resize', handleResize);
        
        if (window.ResizeObserver) {
            const resizeObserver = new ResizeObserver(() => {
                throttledRedraw();
            });
            resizeObserver.observe(canvasWrapper);
        }
        
        // начальная отрисовка
        updateGapControls();
        performRedraw();
    })();
</script>
</body>
